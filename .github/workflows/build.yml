name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 18.x, 20.x, 22.x ]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build

    - name: Verify build output
      run: |
        test -f dist/index.js && test -f dist/index.d.ts && echo "Build successful" || (echo "Build failed: dist/index.js or dist/index.d.ts not found" && exit 1)

    - name: Typecheck
      run: npm run typecheck

    # vitest 3 / vite 7 need Node >= 20.19: on 18.x only the build is checked
    - name: Test
      if: matrix.node-version != '18.x'
      run: npm test
